{% extends "base.html" %}
{% block title %}Novo cartão{% endblock %}
{% block content %}
<div class="page-header"><div><h1>Novo cartão</h1><p class="muted">O cartão é controlado separadamente dos contratos de empréstimo.</p></div></div>
<form method="post" class="card section-card"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid form-grid-2"><label>Cliente<select name="cliente_id" required><option value="">Selecione...</option>{% for cliente in clientes %}<option value="{{ cliente['id'] }}" {{ 'selected' if form['cliente_id']|string == cliente['id']|string }}>{{ cliente['nome'] }}</option>{% endfor %}</select></label><label>Descrição<input name="descricao" value="{{ form['descricao'] }}" maxlength="120" required placeholder="Ex.: Nubank final 1234"></label></div><div class="form-actions"><a class="button button-light" href="{{ url_for('cartoes_lista') }}">Cancelar</a><button class="button" type="submit">Cadastrar cartão</button></div></form>
{% endblock %}
