<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Empréstimo | {% block title %}Portal do cliente{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',filename='css/app.css') }}"></head><body class="portal-body">{% if g.portal_access %}<header class="topbar"><div class="container topbar-content"><a class="brand" href="{{ url_for('portal.dashboard') }}">Empréstimo</a><nav class="nav"><a href="{{ url_for('portal.dashboard') }}">Minha posição</a><a href="{{ url_for('portal.proofs') }}">Comprovantes</a></nav><div class="user-menu"><span class="user-name">{{ g.portal_access['cliente_nome'] }}</span><form method="post" action="{{ url_for('portal.logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="button button-light button-small">Sair</button></form></div></div></header>{% endif %}<main class="container page portal-page">{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><script src="{{ url_for('static',filename='js/app.js') }}" defer></script></body></html>
