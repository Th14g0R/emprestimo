{% extends "base.html" %}
{% block title %}Configuração inicial{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <section class="card auth-card">
        <h1>Configuração inicial</h1>
        <p class="muted">Crie o primeiro usuário administrador do sistema.</p>

        <form method="post" class="form-grid">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label>
                Nome
                <input type="text" name="nome" maxlength="120" required autofocus value="{{ nome|default('') }}">
            </label>

            <label>
                Login
                <input type="text" name="login" maxlength="60" required autocomplete="username" value="{{ login|default('') }}">
            </label>

            <label>
                Senha
                <input type="password" name="senha" minlength="8" required autocomplete="new-password">
            </label>

            <label>
                Confirmar senha
                <input type="password" name="confirmar_senha" minlength="8" required autocomplete="new-password">
            </label>

            <button class="button" type="submit">Criar administrador</button>
        </form>
    </section>
</div>
{% endblock %}
